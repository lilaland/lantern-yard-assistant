[project]
name = "lantern-assistant"
version = "0.1.0"
description = "Marble take-home: restaurant operations assistant over the supplied local API"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assistant", "assistant.modes"]

[tool.setuptools.package-data]
assistant = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
